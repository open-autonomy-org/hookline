name: Land a branch
# Nothing pushes to main: repository rules require a PR and zero approving reviews, with stale-review dismissal.
# Pushing opens the PR and arms native auto-merge, which may land before the independent exact-head task verdict.
# Independent review remains a separate task requirement. No bypass actors.
#   agent/**  the agent's own work        land/**  a maintainer's
on:
  push:
    branches: ['agent/**', 'land/**']
permissions:
  contents: write
  pull-requests: write
jobs:
  land:
    runs-on: ubuntu-latest
    steps:
      - name: Open the pull request once, then arm auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          existing=$(gh pr list -R "$REPO" --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -z "$existing" ]; then
            gh pr create -R "$REPO" --base main --head "$BRANCH" --title "$BRANCH" \
              --body "Opened by the landing workflow for \`$BRANCH\`. GitHub requires a PR and zero approving reviews. Auto-merge may land before the independent exact-head task verdict; that review remains a separate task requirement."
            existing=$(gh pr list -R "$REPO" --head "$BRANCH" --state open --json number -q '.[0].number')
          fi
          # Retry transient API/mergeability races. The active rules require no approving review or
          # status check, so native auto-merge may land immediately without the independent task verdict.
          for attempt in 1 2 3 4 5 6; do
            if gh pr merge -R "$REPO" "$existing" --merge --auto; then echo "pull request #$existing: merged or auto-merge armed"; exit 0; fi
            echo "auto-merge attempt $attempt did not go through; retrying in 20s"; sleep 20
          done
          echo "pull request #$existing: could not arm auto-merge after six attempts; check repository permissions and policy"; exit 1
